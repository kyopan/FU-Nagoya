; PlatformIO Project Configuration File
;
; AS5600 Magnetic Encoder Validation Test
; Hardware:
;   - ESP32-S3 DevKit
;   - AS5600 Evaluation Board
;   - Disc Magnet (6mm diameter × 2.5mm thickness)
; Pin Assignment:
;   - GPIO 8: I2C SDA (AS5600)
;   - GPIO 9: I2C SCL (AS5600)

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
board_build.flash_mode = qio
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
monitor_speed = 115200
upload_speed = 115200
build_flags =
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DARDUINO_USB_MODE=1
	-DBOARD_HAS_PSRAM
lib_deps =
	; Wire library (I2C) is included in Arduino framework
