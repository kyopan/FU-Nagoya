; PlatformIO Project Configuration File
;
; ESP32-S3 DevKit RC Servo Test with Potentiometer
; Hardware:
;   - ESP32-S3 DevKit
;   - RC Servo (DS-M005 or compatible)
;   - 10K Potentiometer
; Pin Assignment:
;   - GPIO 13: Servo PWM output
;   - GPIO 4: Potentiometer ADC input (ADC1_CH3)

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
board_build.flash_mode = qio
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
monitor_speed = 115200
upload_speed = 115200
build_flags =
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DARDUINO_USB_MODE=1
	-DBOARD_HAS_PSRAM
lib_deps =
	; ESP32Servo library for RC servo control
	madhephaestus/ESP32Servo@^3.0.5
	; Adafruit NeoPixel library for RGB LED control
	adafruit/Adafruit NeoPixel@^1.12.3
